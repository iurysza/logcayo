name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, for example v0.2.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Use build scripts from the workflow commit
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- scripts/build-binaries.sh scripts/install.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sh scripts/build-binaries.sh
      - name: Smoke test the linux-x64 binary
        run: ./dist/logcayo-linux-x64 --help >/dev/null
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
